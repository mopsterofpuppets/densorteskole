<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Den Sorte Skole – Game</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase_c.js"></script>
<script src="gameconfig.js"></script>
</head>
<body>

<h1>Den Sorte Skole</h1>

<div class="score" id="scoreboard">
  <h2>Dødsstillingen fra helvede</h2>
  <ul id="teamList"></ul>
</div>

<div id="board"></div>
<div id="timer"></div>

<div id="currentBuzz"></div>

<!-- Game Over Sektion -->
<div id="gameOverScreen" style="display:none; text-align:center; margin-top:50px;">
  <h2 style="font-size:3em; color:#ffcc00;">Spillet er slut!</h2>
  <div id="winningTeam" style="font-size:2.5em; margin:20px 0;"></div>
  <div id="teamRanking" style="margin-top:30px;"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
let gameId = urlParams.get('game') || localStorage.getItem("gameId");
localStorage.setItem("gameId", gameId);

const teamList = document.getElementById('teamList');
const board = document.getElementById('board');
const scoreboard = document.getElementById('scoreboard');
const timerEl = document.getElementById('timer');
const currentBuzz = document.getElementById('currentBuzz');
const previousPoints = {}; // gemmer tidligere point

let timerInterval = null;
let currentBuzzCard = null;
let currentQuestionPoints = 0;
let questionOpen = false;
let timerOnExpireCallback = null;

// Holdliste med avatars
db.ref(gameId + "/teams").on('value', snapshot => {
  teamList.innerHTML = "";
  snapshot.forEach(child => {
    const t = child.val();
    const li = document.createElement('li');
    li.dataset.teamId = child.key;

    const avatar = document.createElement('img');
    avatar.src = t.avatar;
    avatar.width = 30;
    avatar.height = 30;
    avatar.style.marginLeft = '50px';
    avatar.style.borderRadius = '50%';
    avatar.style.marginRight = '10px';
    avatar.className = "teamAvatar";
    avatar.dataset.teamId = child.key;
    li.appendChild(avatar);

    const text = document.createElement('span');
    text.textContent = `${t.name} — ${t.points || 0} point`;
    li.appendChild(text);

    // 🔹 puls hvis point stiger
    if (previousPoints[child.key] !== undefined && t.points > previousPoints[child.key]) {
      text.classList.add("pulse");
      setTimeout(() => text.classList.remove("pulse"), 600);
    }
    previousPoints[child.key] = t.points;

    teamList.appendChild(li);
  });
});

// Buzz og timer, inkl. avatar fremhævning
db.ref(gameId + "/buzz").on('value', snap => {
  const b = snap.val();
  if(b && b.buzzed){

    // Start 10s timer FOR SVAR – når den udløber markerer vi automatisk forkert
    startTimer(10, ()=>{
      // onExpire: marker hold som disqualified (hvis stadig det samme buzz)
      db.ref(gameId + "/buzz").once('value').then(snap2=>{
        const current = snap2.val();
        if(current && current.buzzed && current.teamId){
          db.ref(`${gameId}/disqualifiedTeams/${current.teamId}`).set(true);
          // frigiv buzz men behold spørgsmålet åbent så andre kan buzz
          resetBuzz(true); // CHANGED: keep questionOpen true
        }
      });
    });

    if(currentBuzzCard) currentBuzzCard.classList.add('buzzedCard');

    // Fremhæv avatar på buzzet hold
    document.querySelectorAll('#teamList img').forEach(avatar=>{
      if(avatar.dataset.teamId === b.teamId){
        avatar.classList.add('buzzed');
        avatar.classList.remove('disabled','disqualified');
      } else {
        avatar.classList.add('disabled');
      }
    });
  } else {
    currentBuzz.textContent = "";
    clearInterval(timerInterval);
    timerEl.textContent = "";
    questionOpen = false;
    if(currentBuzzCard) currentBuzzCard.classList.remove('buzzedCard');

    document.querySelectorAll('#teamList img').forEach(img => {
      img.classList.remove('buzzed','disabled');
    });
  }
});

// Track disqualified teams
db.ref(gameId + "/disqualifiedTeams").on('value', snap => {
  const dq = snap.val() || {};
  document.querySelectorAll('#teamList img').forEach(img=>{
    if(dq[img.dataset.teamId]){
      img.classList.add('disqualified');
      img.classList.remove('buzzed','disabled');
    } else {
      img.classList.remove('disqualified');
    }
  });
});

// Initialiser spillepladen med persistence
initBoard();

function initBoard(){
  board.innerHTML='';

  // Tilføj kategorier
  categories.forEach(cat=>{
    const h = document.createElement('div'); 
    h.textContent = cat; 
    h.className='category';
    board.appendChild(h);
  });

  // Hent board-status fra databasen
  db.ref(`${gameId}/board`).once('value').then(snapshot => {
    const boardData = snapshot.val() || {};

    points.forEach((p,rowIndex)=>{
      categories.forEach((cat,colIndex)=>{
        const card = document.createElement('div');
        card.className = 'card';

        const inner = document.createElement('div'); inner.className = 'card-inner';
        const front = document.createElement('div'); front.className = 'card-front'; front.textContent=p;
        const back = document.createElement('div'); back.className = 'card-back'; back.textContent=p;
        inner.appendChild(front); inner.appendChild(back);
        card.appendChild(inner);

        // Hvis kortet allerede er brugt i databasen, markér det
        if(boardData[cat] && boardData[cat][rowIndex] && boardData[cat][rowIndex].used){
          card.classList.add('used');
        }

        card.addEventListener('click', ()=>{
          if(!card.classList.contains('used')){
            card.classList.add('used');
            currentQuestionPoints=p;
            questionOpen=true;
            currentBuzzCard=card;

            // CHANGED: Før vi åbner for buzzere, fjernes tidligere disqualified hold og vinder-ikon (nyt spørgsmål)
            db.ref(`${gameId}/disqualifiedTeams`).remove();
            db.ref(`${gameId}/correctTeams`).remove();

            // Luk for svar øjeblikkeligt i DB, så buzzere ikke kan trykke i det lille splitsekund.
            db.ref(gameId + "/questionOpen").set(false);

            // Åbn først 1 sekund efter – sker i DB så alle klienter får samme timing. (punkt 1)
            setTimeout(()=> {
              db.ref(gameId + "/questionOpen").set(true);
            }, 1000);

            const songData = songs[cat][rowIndex];
            const link = typeof songData === "string" ? songData : songData.spotify;
            const correctAnswer = typeof songData === "string" ? null : songData.answer;

            db.ref(gameId + "/currentQuestion").set({
  		category: cat,
		points: p,
 		answer: correctAnswer,
  		songUrl: link
	    });

            // Gem kortet som brugt i databasen
            if(!boardData[cat]) boardData[cat] = {};
            boardData[cat][rowIndex] = { used:true };
            db.ref(`${gameId}/board`).set(boardData);
          }
        });
        board.appendChild(card);
      });
    });
  });
}

/**
 * startTimer(seconds, onExpire)
 * - hvis onExpire angivet kaldes den når timer når 0
 * - viser nedtælling i timerEl
 */
function startTimer(seconds, onExpire){
  clearInterval(timerInterval);
  timerOnExpireCallback = onExpire || null;
  let t=seconds;
  timerEl.textContent=t;
  timerInterval=setInterval(()=>{
    t--;
    timerEl.textContent=t;
    if(t<=0){
      clearInterval(timerInterval);
      timerEl.textContent="";
      if(typeof timerOnExpireCallback === 'function'){
        // kald callback asynkront for at undgå race med DB-listeners
        try{ timerOnExpireCallback(); } catch(e){ console.error(e); }
      }
    }
  },1000);
}

// CHANGED: resetBuzz kan nu holde spørgsmålet åbent (keepQuestionOpen=true)
function resetBuzz(keepQuestionOpen = false){
  db.ref(gameId + "/buzz").set({buzzed:false, team:null, teamId:null});
  db.ref(gameId + "/buzzLocked").set(false);
  if(!keepQuestionOpen){
    db.ref(gameId + "/questionOpen").set(false);
    questionOpen=false;
  } else {
    // behold questionOpen true i JS-state og i DB (gamemaster vil normalt allerede have sat questionOpen=true)
    db.ref(gameId + "/questionOpen").set(true);
    db.ref(gameId + "/correctTeams").set(null);
    questionOpen = true;
  }
  currentBuzz.textContent="";
  timerEl.textContent="";
  if(currentBuzzCard) currentBuzzCard.classList.remove('buzzedCard');

  document.querySelectorAll('#teamList img').forEach(img => {
    img.classList.remove('buzzed','disabled');
  });
}

/*
function givePoints(teamId, points){
  const teamRef = db.ref(`${gameId}/teams/${teamId}`);
  db.ref(`${gameId}/correctTeams/${teamId}`).set(true);
  teamRef.once('value').then(snap=>{
    const oldPoints = snap.val().points || 0;
    teamRef.update({ points: oldPoints + points });
  });
}*/

// Lyt efter gameOver
db.ref(gameId + "/gameOver").on('value', snap => {
  const over = snap.val();
  if(over){
    // Skjul board og timer
    board.style.display = "none";
    timerEl.style.display = "none";
    currentBuzz.style.display = "none";
    scoreboard.style.display = "none";

    // Find vindende hold
    db.ref(gameId + "/teams").once('value').then(snap => {
      const teams = [];
      snap.forEach(child => {
        const t = child.val();
        teams.push({name:t.name, points:t.points || 0, avatar:t.avatar});
      });
      // Sorter efter points
      teams.sort((a,b)=>b.points-a.points);

      // Fremhæv vinder
      const winner = teams[0];
      document.getElementById("winningTeam").innerHTML =
        `<img src="${winner.avatar}" width="80" height="80" style="border-radius:50%; margin-right:10px;">` +
        `${winner.name} — ${winner.points} point`;

      // Rangliste for øvrige hold
      const rankingEl = document.getElementById("teamRanking");
      rankingEl.innerHTML = "";
      for(let i=1; i<teams.length; i++){
        const t = teams[i];
        const div = document.createElement("div");
        div.style.fontSize = "1.5em";
        div.style.margin = "5px 0";
        div.innerHTML = `<img src="${t.avatar}" width="40" height="40" style="border-radius:50%; margin-right:10px;"> ${t.name} — ${t.points} point`;
        rankingEl.appendChild(div);
      }

      // Vis Game Over skærm
      document.getElementById("gameOverScreen").style.display = "block";
    });
  }
});

</script>
</body>
</html>
