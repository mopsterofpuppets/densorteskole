<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Den Sorte Skole - Join</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>

.container {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.team-row {
  display:flex;
  flex-wrap: wrap;
  gap:20px;
  justify-content: center;
  margin-top:20px;
}
.team {
  text-align:center;
  border:2px solid #666;
  border-radius:10px;
  padding:10px;
  transition: all 0.3s;
}
.team img {
  width:100px;
  height:100px;
  border-radius:10px;
}
#qrContainer {
  margin-top:20px;
  cursor:pointer;
}
#startBtn {
  margin-top:30px;
  padding:20px 50px;
  font-size:2em;
  font-family: 'Metal Mania', cursive;
  background: linear-gradient(145deg,#ab0000,#8b0000);
  color:#fff;
  border:none;
  border-radius:15px;
  cursor:not-allowed;
  box-shadow:0 8px #67000f;
  text-shadow: 2px 2px 5px black;
  transition: all 0.1s ease-in-out;
}
#startBtn:active {
  transform: translateY(4px);
  box-shadow:0 2px #67000f;
}
#startBtn.enabled {
  cursor:pointer;
}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase_c.js"></script>
</head>
<body>
<div class="container">
  <h1>Den Sorte Skole</h1>
  <div id="qrContainer">
    <canvas id="qrCode"></canvas>
    
  </div>
  <div>Scan to Join...</div>
  <button id="startBtn">Start Undervisning</button>
  <div class="team-row" id="teamRow"></div>
</div>

<script>
// Opret unikt gameId
let gameId = "game_" + Date.now();
const teamsRef = db.ref(gameId + "/teams");
const gameStartedRef = db.ref(gameId + "/gameStarted");
const teamRowEl = document.getElementById("teamRow");
const startBtn = document.getElementById("startBtn");

// Fastsæt join-siden uanset om index.htm er skrevet eller ej
let basePath = location.pathname;
if(basePath.endsWith("/")) basePath += "join.htm"; // hvis root, tilføj join.htm
else basePath = basePath.replace(/index\.htm(l)?$/,"join.htm"); // erstatter index.htm eller index.html

const qr = new QRious({
  element: document.getElementById('qrCode'),
  value: window.location.origin + basePath + "?game=" + gameId,
  size: 200
});

// Klik på QR åbner join-siden i nyt vindue
document.getElementById("qrContainer").addEventListener("click", ()=>{
  window.open(qr.value,"_blank");
});

// Vis alle joinede hold med avatar
teamsRef.on("value", snap=>{
  const teams = snap.val() || {};
  teamRowEl.innerHTML="";
  Object.keys(teams).forEach(id=>{
    const t = teams[id];
    const div = document.createElement("div");
    div.className="team";
    div.id="team_"+id;
    div.innerHTML=`<img src="${t.avatar}"><div>${t.name}</div>`;
    teamRowEl.appendChild(div);
  });

  // Aktivér startknap kun hvis mindst ét hold
  if(Object.keys(teams).length > 0){
    startBtn.classList.add("enabled");
    startBtn.disabled = false;
  } else {
    startBtn.classList.remove("enabled");
    startBtn.disabled = true;
  }
});

// Start spillet når knappen trykkes
startBtn.addEventListener("click", ()=>{
  if(startBtn.disabled) return;
  gameStartedRef.set(true).then(()=>{
    // Send gamemaster videre til game.htm med gameId
    window.location.href = `game.htm?game=${gameId}`;
  });
});
</script>
</body>
</html>
