<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Den Sorte Skole – Game</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase_c.js"></script>
<script src="gameconfig.js"></script>
</head>
<style>
body{
  font-size:1.5em;
}
</style>
<body>

<h1>Den Sorte Skole</h1>

<div class="score">
  <h2>Dødsstillingen fra helvede</h2>
  <ul id="teamList"></ul>
</div>

<div id="board" style="display:none"></div>
<div id="timer"></div>

<div id="currentBuzz"></div>
<div id="answerDisplay" style="font-size:1.5em; margin-top:10px; color:#ffcc00;"></div> <!-- 🟡 nyt felt til svar -->

<div id="controlButtons">
  <button id="correctBtn">Oh yeah</button>
  <button id="wrongBtn">Fucking forkert</button>
</div>

<!-- Spotify player er nu altid synlig -->
<iframe id="player" allow="encrypted-media" width="800" height="300" style="border:none;"></iframe>

<!-- Afslut spil-knap -->
<div style="margin-top:20px; text-align:center;">
  <button id="endGameBtn" style="font-size:1.2em; padding:10px 20px; background:#ff4444; color:white; border:none; border-radius:5px; cursor:pointer;">
    Afslut spil
  </button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
let gameId = urlParams.get('game') || localStorage.getItem("gameId");
localStorage.setItem("gameId", gameId);

const teamList = document.getElementById('teamList');
const board = document.getElementById('board');
const timerEl = document.getElementById('timer');
const player = document.getElementById('player');
const correctBtn = document.getElementById('correctBtn');
const wrongBtn = document.getElementById('wrongBtn');
const currentBuzz = document.getElementById('currentBuzz');
const answerDisplay = document.getElementById('answerDisplay'); // 🟡 nyt felt
const endGameBtn = document.getElementById('endGameBtn');

let timerInterval = null;
let currentBuzzCard = null;
let currentQuestionPoints = 0;
let currentCorrectAnswer = null; // 🟡 husk svaret
let questionOpen = false;
let timerOnExpireCallback = null;

// Holdliste med avatars
db.ref(gameId + "/teams").on('value', snapshot => {
  teamList.innerHTML = "";
  snapshot.forEach(child => {
    const t = child.val();
    const li = document.createElement('li');
    li.dataset.teamId = child.key;

    const avatar = document.createElement('img');
    avatar.src = t.avatar;
    avatar.width = 30;
    avatar.height = 30;
    avatar.style.marginLeft = '50px';
    avatar.style.borderRadius = '50%';
    avatar.style.marginRight = '10px';
    avatar.className = "teamAvatar";
    avatar.dataset.teamId = child.key;
    li.appendChild(avatar);

    const text = document.createElement('span');
    text.textContent = `${t.name} — ${t.points || 0} point`;
    li.appendChild(text);

    teamList.appendChild(li);
  });
});

endGameBtn.addEventListener('click', () => {
  if(confirm("Er du sikker på, at du vil afslutte spillet?")) {
    db.ref(gameId + "/gameOver").set(true)
      .then(() => {
        alert("Spillet er nu afsluttet.");
      })
      .catch(err => {
        console.error("Fejl ved afslutning af spil:", err);
      });
  }
});

// Buzz og timer
db.ref(gameId + "/buzz").on('value', snap => {
  const b = snap.val();
  if (b && b.buzzed) {
    correctBtn.style.display = "inline-block";
    wrongBtn.style.display = "inline-block";

    // 🟡 vis det korrekte svar, når nogen buzzer
    if (currentCorrectAnswer) {
      answerDisplay.textContent = "Rigtigt svar: " + currentCorrectAnswer;
    }

    startTimer(10, () => {
      db.ref(gameId + "/buzz").once('value').then(snap2 => {
        const current = snap2.val();
        if (current && current.buzzed && current.teamId) {
          db.ref(`${gameId}/disqualifiedTeams/${current.teamId}`).set(true);
          resetBuzz(true);
        }
      });
    });

    if (currentBuzzCard) currentBuzzCard.classList.add('buzzedCard');

    document.querySelectorAll('#teamList img').forEach(avatar => {
      if (avatar.dataset.teamId === b.teamId) {
        avatar.classList.add('buzzed');
        avatar.classList.remove('disabled','disqualified');
      } else {
        avatar.classList.add('disabled');
      }
    });
  } else {
    currentBuzz.textContent = "";
    correctBtn.style.display = "none";
    wrongBtn.style.display = "none";
    clearInterval(timerInterval);
    timerEl.textContent = "";
    questionOpen = false;
    answerDisplay.textContent = ""; // 🟡 fjern svaret igen
    if (currentBuzzCard) currentBuzzCard.classList.remove('buzzedCard');

    document.querySelectorAll('#teamList img').forEach(img => {
      img.classList.remove('buzzed','disabled');
    });
  }
});

// Disqualified teams
db.ref(gameId + "/disqualifiedTeams").on('value', snap => {
  const dq = snap.val() || {};
  document.querySelectorAll('#teamList img').forEach(img => {
    if (dq[img.dataset.teamId]) {
      img.classList.add('disqualified');
      img.classList.remove('buzzed','disabled');
    } else {
      img.classList.remove('disqualified');
    }
  });
});

initBoard();

function initBoard(){
  board.innerHTML='';

  categories.forEach(cat=>{
    const h = document.createElement('div'); 
    h.textContent = cat; 
    h.className='category';
    board.appendChild(h);
  });

  db.ref(`${gameId}/board`).once('value').then(snapshot => {
    const boardData = snapshot.val() || {};

    points.forEach((p,rowIndex)=>{
      categories.forEach((cat,colIndex)=>{
        const card = document.createElement('div');
        card.className = 'card';

        const inner = document.createElement('div'); inner.className = 'card-inner';
        const front = document.createElement('div'); front.className = 'card-front'; front.textContent=p;
        const back = document.createElement('div'); back.className = 'card-back'; back.textContent=p;
        inner.appendChild(front); inner.appendChild(back);
        card.appendChild(inner);

        if (boardData[cat] && boardData[cat][rowIndex] && boardData[cat][rowIndex].used) {
          card.classList.add('used');
        }

        card.addEventListener('click', ()=>{
          if (!card.classList.contains('used')) {
            card.classList.add('used');
            currentQuestionPoints = p;
            questionOpen = true;
            currentBuzzCard = card;

            db.ref(`${gameId}/disqualifiedTeams`).remove();
            db.ref(`${gameId}/correctTeams`).remove();

            db.ref(gameId + "/questionOpen").set(false);
            setTimeout(()=> {
              db.ref(gameId + "/questionOpen").set(true);
            }, 1000);

            const songData = songs[cat][rowIndex];
            const link = typeof songData === "string" ? songData : songData.spotify;
            currentCorrectAnswer = typeof songData === "string" ? null : songData.answer; // 🟡 gem svaret

            // Afspil direkte – Spotify-player er nu synlig
            player.src = makeSpotifyEmbedUrl(link);

            if(!boardData[cat]) boardData[cat] = {};
            boardData[cat][rowIndex] = { used:true };
            db.ref(`${gameId}/board`).set(boardData);
          }
        });
        board.appendChild(card);
      });
    });
  });
}

function startTimer(seconds, onExpire){
  clearInterval(timerInterval);
  timerOnExpireCallback = onExpire || null;
  let t=seconds;
  timerEl.textContent=t;
  timerInterval=setInterval(()=>{
    t--;
    timerEl.textContent=t;
    if(t<=0){
      clearInterval(timerInterval);
      timerEl.textContent="";
      if(typeof timerOnExpireCallback === 'function'){
        try{ timerOnExpireCallback(); } catch(e){ console.error(e); }
      }
    }
  },1000);
}

function resetBuzz(keepQuestionOpen = false){
  db.ref(gameId + "/buzz").set({buzzed:false, team:null, teamId:null});
  db.ref(gameId + "/buzzLocked").set(false);
  if(!keepQuestionOpen){
    db.ref(gameId + "/questionOpen").set(false);
    questionOpen=false;
  } else {
    db.ref(gameId + "/questionOpen").set(true);
    db.ref(gameId + "/correctTeams").set(null);
    questionOpen = true;
  }
  currentBuzz.textContent="";
  answerDisplay.textContent=""; // 🟡 ryd svaret
  correctBtn.style.display="none";
  wrongBtn.style.display="none";
  timerEl.textContent="";
  if(currentBuzzCard) currentBuzzCard.classList.remove('buzzedCard');

  document.querySelectorAll('#teamList img').forEach(img => {
    img.classList.remove('buzzed','disabled');
  });
}

correctBtn.addEventListener('click', ()=>{
  db.ref(gameId + "/buzz").once('value').then(snap=>{
    const b = snap.val();
    if(b && b.buzzed){
      givePoints(b.teamId, currentQuestionPoints);
      resetBuzz(false);
    }
  });
});

wrongBtn.addEventListener('click', ()=>{
  db.ref(gameId + "/buzz").once('value').then(snap=>{
    const b = snap.val();
    if(b && b.buzzed && b.teamId){
      db.ref(`${gameId}/disqualifiedTeams/${b.teamId}`).set(true);
    }
    resetBuzz(true);
  });
});

function givePoints(teamId, points){
  const teamRef = db.ref(`${gameId}/teams/${teamId}`);
  db.ref(`${gameId}/correctTeams/${teamId}`).set(true);
  teamRef.once('value').then(snap=>{
    const oldPoints = snap.val().points || 0;
    teamRef.update({ points: oldPoints + points });
  });
  player.src = player.src;
}

// 🟡 Lyt efter valgt spørgsmål fra game.htm
db.ref(gameId + "/currentQuestion").on('value', snap => {
  const q = snap.val();
  if (q) {
    // vis kategori, pointværdi og korrekt svar
    answerDisplay.innerHTML =
      `<div><strong>Kategori:</strong> ${q.category}</div>` +
      `<div><strong>Værdi:</strong> ${q.points}</div>` +
      (q.answer ? `<div><small>Rigtigt svar: ${q.answer}</small></div>` : "");

    currentQuestionPoints = q.points || 0; // 🟡 gem pointværdien lokalt

    // sæt musiklink
    if (q.songUrl) {
      player.src = makeSpotifyEmbedUrl(q.songUrl);
    }
  } else {
    answerDisplay.textContent = "";
  }
});

function makeSpotifyEmbedUrl(url) {
  if (!url) return "";
  // hvis det er af typen spotify:track:xxxx
  if (url.startsWith("spotify:track:")) {
    const id = url.split(":").pop();
    return `https://open.spotify.com/embed/track/${id}`;
  }
  // hvis det er af typen https://open.spotify.com/track/xxxx
  if (url.includes("open.spotify.com/track/")) {
    const id = url.split("track/")[1].split("?")[0];
    return `https://open.spotify.com/embed/track/${id}`;
  }
  // fallback: returnér originalen
  return url;
}
</script>
</body>
</html>
