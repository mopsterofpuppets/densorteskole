<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Den Sorte Skole - Waiting</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.container {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.team-row {
  display:flex;
  flex-wrap: wrap;
  gap:20px;
  justify-content: center;
}
.team {
  text-align:center;
  border:2px solid #666;
  border-radius:10px;
  padding:10px;
  transition: all 0.3s;
}
.team img {
  width:100px;
  height:100px;
  border-radius:10px;
}
.wait-text{
  padding-top:25px;
  display:none;
}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase_c.js"></script>
</head>
<body>
<div class="container">
  <h1>Den Sorte Skole</h1>
  <div class="team-row" id="teamRow"></div>
  <div class="wait-text" id="waitText">Undervisningen begynder om lidt...</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const gameId = urlParams.get("game");
const teamId = urlParams.get("team");

const gameRef = db.ref(gameId);
const teamsRef = db.ref(gameId + "/teams");
const gameStartedRef = db.ref(gameId + "/gameStarted");

// Vis hold og avatars (ingen point)
teamsRef.on("value", snap=>{
  const teams = snap.val() || {};
  const teamRowEl = document.getElementById("teamRow");
  teamRowEl.innerHTML="";
  Object.keys(teams).forEach(id=>{
    const t = teams[id];
    const div = document.createElement("div");
    div.className="team";
    div.id="team_"+id;
    div.innerHTML=`<img src="${t.avatar}"><div>${t.name}</div>`;
    teamRowEl.appendChild(div);
    document.getElementById("waitText").style.display='inline';
  });
});

// Når gamemaster starter spillet -> send til buzz
gameStartedRef.on("value", snap=>{
  if(snap.val() && teamId){
    window.location.href = `buzz.htm?game=${gameId}&team=${teamId}`;
  }
});
</script>
</body>
</html>
