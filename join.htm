<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Den Sorte Skole - Join</title>
<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Metal+Mania" rel="stylesheet">
<style>

.container {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

input, button {
  font-family: 'Metal Mania', cursive;
  font-size:2.2em;
  padding:15px;
  margin:10px;
  border-radius:10px;
  border:none;
  text-align:center;
}
button {
  background:#e63946;
  color:#fff;
  cursor:pointer;
  box-shadow:0 5px #b32c36;
  transition: all 0.1s ease-in-out;
  width:150px;
}
button:active {
  transform: translateY(4px);
  box-shadow:0 1px #b32c36;
}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase_c.js"></script>
</head>
<body>
<div class="container">
  <h1>Den Sorte Skole</h1>
  <input type="text" id="teamName" style="width:500px" placeholder="Indtast holdnavn fra helvede" maxlength="20">
  <button id="joinBtn">Join</button>
  <div id="errorMsg" style="margin-top:10px;color:red;"></div>
</div>

<script>
// Hent gameId fra URL
const urlParams = new URLSearchParams(window.location.search);
const gameId = urlParams.get("game");

if(!gameId){
  document.getElementById("errorMsg").textContent = "Ingen spil-id angivet!";
}

const teamsRef = db.ref(gameId + "/teams");

const joinBtn = document.getElementById("joinBtn");
const errorMsg = document.getElementById("errorMsg");
const teamInput = document.getElementById("teamName");

// Avatar-generator (samme som game.htm)
const avatars = [
  "https://api.dicebear.com/5.x/identicon/svg?seed=1",
  "https://api.dicebear.com/5.x/identicon/svg?seed=2",
  "https://api.dicebear.com/5.x/identicon/svg?seed=3",
  "https://api.dicebear.com/5.x/identicon/svg?seed=4",
  "https://api.dicebear.com/5.x/identicon/svg?seed=5",
  "https://api.dicebear.com/5.x/identicon/svg?seed=6",
  "https://api.dicebear.com/5.x/identicon/svg?seed=7",
  "https://api.dicebear.com/5.x/identicon/svg?seed=8",
  "https://api.dicebear.com/5.x/identicon/svg?seed=9"
];

joinBtn.addEventListener("click", ()=>{
  const name = teamInput.value.trim();
  if(!name){
    errorMsg.textContent = "Indtast et holdnavn!";
    return;
  }

  // Generer unik teamId
  const teamId = "team_" + Date.now();

  // Tildel avatar baseret på teamId (ensartet ved reload)
  const avatarIndex = teamId.charCodeAt(teamId.length-1) % avatars.length;
  const avatar = avatars[avatarIndex];

  console.log("Gemmer hold i FB");
 
  // Gem hold i Firebase
  teamsRef.child(teamId).set({
    name: name,
    avatar: avatar,
    points: 0,
    buzzed: false
  }).then( () => {
    console.log("Redirecting to wait page");

    // bygg korrekt base uanset om vi kører i en subfolde
    const origin = window.location.origin;
    const path = window.location.pathname;
  
    // fjern sidste segment (filnavn) og behold resten af stien
    const folder = path.replace(/\/[^/]*$/, "/");

    // sammensæt URL (brug origin hvis ikke file:)
    const base = origin.startsWith("file:") ? folder : origin + folder;

    const redirectUrl = `${base}waiting.htm?game=${encodeURIComponent(gameId)}&team=${encodeURIComponent(teamId)}`;

    // lille timeout i nogle mobile browsere hjælper
    setTimeout(()=> window.location.href = redirectUrl, 50);
  })
  .catch(err => {
    errorMsg.textContent = "Kunne ikke gemme hold";
    console.log(err && err.message ? err.message : err);
  });

});
</script>
</body>
</html>
