<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Den Sorte Skole – Game (Web Playback SDK)</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase_c.js"></script>
<script src="gameconfig.js"></script>
</head>
<style>
body{ font-size:1.6em; }
button { cursor:pointer; }
#playerControls { margin-top:10px; }

#spotifyControls button {
    font-size: 2.5em;       /* større play/pause knap */
    padding: 25px 25px;   /* større touch-target */
}

#volumeSlider {
    margin-top: 10px;
    width:500px; margin-left:50px;
}

#controlButtons {
    display: flex;
    justify-content: space-around;  /* giver afstand mellem knapperne */
    margin-top: 15px;
}

#playPauseBtn {
    background: #ffcc00;        /* lysere baggrund, tydelig på mørk baggrund */
    color: #330000;             /* kontrastfarve for tekst/emoji */
    font-size: 2.5em;           /* større touch-target */
    padding: 15px 25px;         /* større klikområde */
    border: none;               /* fjern global button-border */
    border-radius: 10px;        /* rund hjørner */
    box-shadow: 0 0 15px #ff8800; /* enkel skygge, fjern rød “glød” */
    cursor: pointer;
    margin: 10px 5px;
    transition: transform 0.2s, box-shadow 0.2s;
}

#correctBtn {
    background-color: #4CAF50; /* grøn */
    color: white;
    font-size: 1.9em;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
}

#wrongBtn {
    background-color: #f44336; /* rød */
    color: white;
    font-size: 1.9em;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
}

#endGameBtn {
    margin-top: 250px;   /* større afstand fra øvrige elementer */
    font-size: 1.5em;   /* lidt større knap */
    padding: 50px 50px;
    border-radius: 8px;
}

</style>
<body>

<h1>Den Sorte Skole</h1>

<div class="score">
  <h2>Dødsstillingen fra helvede</h2>
  <ul id="teamList"></ul>
</div>

<audio id="buzzSound" src="ping.mp3" preload="auto"></audio>
<audio id="wrongSound" src="wrong.mp3" preload="auto"></audio>

<div id="board" style="display:none"></div>
<div id="timer"></div>

<div id="currentBuzz"></div>
<div id="answerDisplay" style="font-size:1.5em; margin-top:10px; color:#ffcc00;"></div>

<div id="controlButtons">
  <button id="correctBtn"> CORRECT </button>
  <button id="wrongBtn"> WRONG </button>
</div>

<!-- Spotify Web Playback SDK kontroller -->
<div id="playerControls">
  <button id="loginBtn">Log ind med Spotify</button>
  <p id="playerStatus">Spotify ikke forbundet</p>

  <div id="spotifyControls" style="margin-top:20px; display:none;">
    <button id="playPauseBtn">▶️</button>
    <input id="volumeSlider" type="range" min="0" max="100" value="80">
  </div>

</div>

<!-- Afslut spil-knap -->
<div style="margin-top:20px; text-align:center;">
  <button id="endGameBtn" style="font-size:1.2em; padding:10px 20px; background:#ff4444; color:white; border:none; border-radius:5px;">
    Afslut spil
  </button>
</div>

<script>

// Spotify Web Playback SDK setup
const clientId = "f71d4ec597bd4e1094fa14db40250c19";
const redirectUri = "https://mopsterofpuppets.github.io/densorteskole/qm.htm";
const scopes = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
const authUrl = new URL("https://accounts.spotify.com/authorize");

const teamList = document.getElementById('teamList');
const board = document.getElementById('board');
const timerEl = document.getElementById('timer');
const correctBtn = document.getElementById('correctBtn');
const wrongBtn = document.getElementById('wrongBtn');
const currentBuzz = document.getElementById('currentBuzz');
const answerDisplay = document.getElementById('answerDisplay');
const endGameBtn = document.getElementById('endGameBtn');
const buzzSound = document.getElementById("buzzSound");
const wrongSound = document.getElementById("wrongSound");

const loginBtn = document.getElementById("loginBtn");
const playerStatus = document.getElementById("playerStatus");

const playPauseBtn = document.getElementById("playPauseBtn");
const volumeSlider = document.getElementById("volumeSlider");
const spotifyControls = document.getElementById("spotifyControls");
let isPlaying = false;

// Hent access token fra URL hash
const hash = window.location.hash.substring(1);
const tokenParams = new URLSearchParams(hash);

let accessToken = null;
let player = null;
let deviceId = null;
let currentTrackUri = null;
let isPlayerReady = false; // 🟡 nyt flag

const generateRandomString = (length) => {
  const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const values = crypto.getRandomValues(new Uint8Array(length));
  return values.reduce((acc, x) => acc + possible[x % possible.length], "");
}

function sha256(plain){
  const encoder = new TextEncoder();
  const data = encoder.encode(plain);
  return window.crypto.subtle.digest('SHA-256', data);
}

const base64encode = (input) => {
  return btoa(String.fromCharCode(...new Uint8Array(input)))
    .replace(/=/g, '')
    .replace(/\+/g, '-')
    .replace(/\//g, '_');
}

const getToken = async (code) => {
  const codeVerifier = localStorage.getItem('code_verifier');
  const url = "https://accounts.spotify.com/api/token";

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: clientId,
      grant_type: 'authorization_code',
      code,
      redirect_uri: redirectUri,
      code_verifier: codeVerifier,
    }),
  });

  const data = await res.json();
  console.log("Token-respons:", data);

  if (data.access_token) {
    localStorage.setItem('access_token', data.access_token);
    if (data.refresh_token) {
      localStorage.setItem('refresh_token', data.refresh_token);
    }
    accessToken = data.access_token;
    console.log("Access token gemt:", accessToken);
  } else {
    throw new Error("Ingen access_token i svar: " + JSON.stringify(data));
  }
};

const getRefreshToken = async () => {
  const refreshToken = localStorage.getItem('refresh_token');
  if (!refreshToken || refreshToken === 'null') {
    console.warn("Ingen refresh_token fundet — brugeren skal logge ind igen");
    return;
  }

  const url = "https://accounts.spotify.com/api/token";

  const payload = {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: refreshToken,
      client_id: clientId
    }),
  };

  const res = await fetch(url, payload);
  const data = await res.json();

  if (data.access_token) {
    localStorage.setItem('access_token', data.access_token);
    accessToken = data.access_token;
    console.log("🔄 Access token fornyet:", accessToken);

    if (data.refresh_token) {
      localStorage.setItem('refresh_token', data.refresh_token);
    }
  } else {
    console.error("Kunne ikke forny token:", data);
  }
};

let codeVerifier = localStorage.getItem('code_verifier');
if (!codeVerifier || codeVerifier === 'null') {
  codeVerifier = generateRandomString(64);
  localStorage.setItem('code_verifier', codeVerifier);
}

const urlParams = new URLSearchParams(window.location.search);
let gameId = urlParams.get('game') || localStorage.getItem("gameId");
localStorage.setItem("gameId", gameId);

let code = urlParams.get('code') || localStorage.getItem("code");

(async () => {
  const code = urlParams.get('code');
  if (code && !localStorage.getItem('access_token')) {
    console.log("Modtog authorization code:", code);
    try {
      await getToken(code);
      const newUrl = window.location.origin + window.location.pathname;
      window.history.replaceState({}, document.title, newUrl);
    } catch (err) {
      console.error("Fejl ved hentning af access token:", err);
    }
  }

  accessToken = localStorage.getItem("access_token");

  if (accessToken) {
    console.log("Access token fundet:", accessToken);

// 🧪 TEST Spotify API forbindelse + håndtér evt. udløbet token
try {
  const res = await fetch("https://api.spotify.com/v1/me", {
    headers: { "Authorization": "Bearer " + accessToken }
  });

  console.log("Svar fra /me:", res.status);

  // Hvis token er udløbet, forsøg at forny
  if (res.status === 401) {
    console.warn("Access token udløbet – forsøger at forny via refresh_token...");

    if (localStorage.getItem("refresh_token")) {
      await getRefreshToken();
      accessToken = localStorage.getItem("access_token");
      console.log("Access token er nu:", accessToken);

      if (!accessToken || accessToken === "null") {
        localStorage.removeItem("access_token");
        playerStatus.textContent = "⚠️ Kunne ikke forny token – log ind igen";
        loginBtn.style.display = "inline-block";
        console.log("Enabler login button igen - kunne ikke forny token");
        return;
      }

      // 🔁 Forsøg /me igen efter fornyelse
      console.log("Forsøger /me igen efter refresh...");
      await verifySpotifyAccess(accessToken);
    } else {
      console.warn("Ingen refresh_token til fornyelse. Tvinger bruger til at logge ind igen med samtykke.");
      playerStatus.textContent = "⚠️ Ingen refresh_token — log ind igen";
      loginBtn.style.display = "inline-block";
      localStorage.removeItem("access_token");
      console.log("Enabler login button igen - ingen refresh token i local storage");
      return;
    }
  }

  // Hvis /me lykkes (200 OK)
  const data = await res.json();
  if (res.ok) {
    console.log("🔍 Test: /v1/me", data);
    console.log(`✅ Forbundet som ${data.display_name} (${data.id}), produkt: ${data.product}`);
    playerStatus.textContent = `🔒 Logget ind som ${data.display_name} (${data.product})`;
  } else {
    console.warn("⚠️ /me-fejl:", res.status, data);
    playerStatus.textContent = "⚠️ Fejl ved /me – se console";
  }

} catch (err) {
  console.error("❌ Kunne ikke kalde /v1/me:", err);
  playerStatus.textContent = "❌ Fejl ved test af Spotify API";
}

    loginBtn.style.display = "none";

    const script = document.createElement("script");
    script.src = "https://sdk.scdn.co/spotify-player.js";
    document.body.appendChild(script);

    window.onSpotifyWebPlaybackSDKReady = () => {
      player = new Spotify.Player({
        name: "Den Sorte Skole Player",
        getOAuthToken: cb => { cb(accessToken); },
        volume: 0.8
      });

      console.log("Player created");

      player.addListener('initialization_error', ({ message }) => console.error('Init error:', message));
      player.addListener('authentication_error', ({ message }) => console.error('Auth error:', message));
      player.addListener('account_error', ({ message }) => console.error('Account error:', message));
      player.addListener('playback_error', ({ message }) => console.error('Playback error:', message));

      player.addListener('player_state_changed', state => {
        if (!state) return;
        isPlaying = !state.paused;
        playPauseBtn.textContent = isPlaying ? "⏸️" : "▶️";
      });

      player.addListener("ready", async ({ device_id }) => {
        deviceId = device_id;
        isPlayerReady = true;
        playerStatus.textContent = "🎶 Player klar";
        spotifyControls.style.display = "block";
        console.log("Player ready - device = " + deviceId);

        // 🕐 Vent et sekund så Spotify når at registrere enheden
        await new Promise(r => setTimeout(r, 1000));

        try {
          const transferRes = await fetch("https://api.spotify.com/v1/me/player", {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${accessToken}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ device_ids: [deviceId], play: false })
          });

          const text = await transferRes.text();
          console.log("Transfer playback:", transferRes.status, text);
        } catch (err) {
          console.error("Fejl ved transferPlayback:", err);
        }
      });

      player.connect().then(success => {
        console.log("Player connect result:", success);
        if (!success) {
          console.warn("⚠️ Player connect mislykkedes");
          isPlayerReady = false;
        }
      });
      console.log("Player connected");

      volumeSlider.addEventListener("input", async (e) => {
         const newVol = e.target.value / 100;
        if (player) {
          try {
            await player.setVolume(newVol);
            console.log("🔊 Volume:", newVol);
          } catch (err) {
            console.error("Fejl ved setVolume:", err);
          }
        }
      });

      playPauseBtn.addEventListener("click", async () => {
        if (!player || !accessToken) return;
        try {
          if (isPlaying) {
            await fetch("https://api.spotify.com/v1/me/player/pause", {
              method: "PUT",
              headers: { "Authorization": `Bearer ${accessToken}` }
            });
            playPauseBtn.textContent = "▶️";
            isPlaying = false;
          } else {
            await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
              method: "PUT",
              headers: { "Authorization": `Bearer ${accessToken}` }
            });
            playPauseBtn.textContent = "⏸️";
            isPlaying = true;
         }
        } catch (err) {
          console.error("Fejl ved play/pause:", err);
        }
      });

    };
  } else {
    console.log("Ingen access_token endnu – klik på 'Log ind med Spotify'");
  }
})();


async function verifySpotifyAccess(token) {
  const res = await fetch("https://api.spotify.com/v1/me", {
    headers: { "Authorization": "Bearer " + token }
  });
  const data = await res.json();
  if (res.ok) {
    console.log(`✅ Forbundet som ${data.display_name} (${data.id}), produkt: ${data.product}`);
    playerStatus.textContent = `🔒 Logget ind som ${data.display_name} (${data.product})`;
  } else {
    console.warn("⚠️ /me-fejl:", res.status, data);
    playerStatus.textContent = "⚠️ Fejl ved /me – se console";
  }
}

loginBtn.addEventListener("click", async () => {
  const hashed = await sha256(codeVerifier);
  const codeChallenge = base64encode(hashed);

  const params =  {
    response_type: 'code',
    client_id: clientId,
    scope: scopes,
    code_challenge_method: 'S256',
    code_challenge: codeChallenge,
    redirect_uri: redirectUri
  };

  authUrl.search = new URLSearchParams(params).toString();
  console.log("Navigating to " + authUrl);
  window.location.href = authUrl.toString();
});

db.ref(gameId + "/currentQuestion").on('value', snap => {
  const q = snap.val();
  if (q) {
    answerDisplay.innerHTML =
      `<div><strong>Kategori:</strong> ${q.category}</div>` +
      `<div><strong>Værdi:</strong> ${q.points}</div>` +
      (q.answer ? `<div><small>Rigtigt svar: ${q.answer}</small></div>` : "");

    currentQuestionPoints = q.points || 0;

    console.log("🎧 Forsøger at starte afspilning på Web Player device:", deviceId);

    // 🟡 Kun forsøg at afspille hvis playeren faktisk er klar
    if (q.songUrl && player && accessToken && isPlayerReady && deviceId) {
      currentTrackUri = makeSpotifyUri(q.songUrl);
      fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
        method: "PUT",
        body: JSON.stringify({ uris: [currentTrackUri] }),
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${accessToken}`
        }
      }).then(() => {
        console.log("Afspiller");
        player.setVolume(0.8);
        playerStatus.textContent = "▶️ Afspiller nu";
      }).catch(err => {
        console.error(err);
        playerStatus.textContent = "❌ Fejl ved afspilning";
      });
    } else {
      answerDisplay.textContent = "";
      const missing = [];
      if (!q.songUrl) missing.push("q.songUrl mangler");
      if (!player) missing.push("player ikke initialiseret");
      if (!isPlayerReady) missing.push("player ikke klar");
      console.warn("Musik blev ikke afspillet fordi:", missing.join(", "));
    }

  } else {
    answerDisplay.textContent = "";
  }
});

let timerInterval = null;
let currentBuzzCard = null;
let currentQuestionPoints = 0;
let currentCorrectAnswer = null;
let questionOpen = false;
let timerOnExpireCallback = null;

db.ref(gameId + "/teams").on('value', snapshot => {
  teamList.innerHTML = "";
  snapshot.forEach(child => {
    const t = child.val();
    const li = document.createElement('li');
    li.dataset.teamId = child.key;

    const avatar = document.createElement('img');
    avatar.src = t.avatar;
    avatar.width = 30;
    avatar.height = 30;
    avatar.style.marginLeft = '50px';
    avatar.style.borderRadius = '50%';
    avatar.style.marginRight = '10px';
    avatar.className = "teamAvatar";
    avatar.dataset.teamId = child.key;
    li.appendChild(avatar);

    const text = document.createElement('span');
    text.textContent = `${t.name} — ${t.points || 0} point`;
    li.appendChild(text);

    teamList.appendChild(li);
  });
});

async function setProgramVolume(vol) {
  if (player) {
    await player.setVolume(vol);
    volumeSlider.value = vol * 100;
  }
}

endGameBtn.addEventListener('click', () => {
  if(confirm("Er du sikker på, at du vil afslutte spillet?")){
    db.ref(gameId + "/gameOver").set(true)
      .then(()=> alert("Spillet er nu afsluttet."))
      .catch(err=> console.error(err));
  }
});

db.ref(gameId + "/buzz").on('value', snap => {
  const b = snap.val();
  if(b && b.buzzed){
    console.log("Buzzed");
    correctBtn.style.display = "inline-block";
    wrongBtn.style.display = "inline-block";

    reduceVolumeForBuzz();

      // ⚡ Her spiller vi lyd EN gang
      try {
        buzzSound.currentTime = 0;
        buzzSound.play().catch(err => console.warn("Buzz-lyd kunne ikke afspilles:", err));
      } catch(e) {
        console.warn("Buzz-lyd fejl:", e);
      }

    startTimer(10, ()=>{
      db.ref(gameId + "/buzz").once('value').then(snap2=>{
        const current = snap2.val();
        if(current && current.buzzed && current.teamId){
          db.ref(`${gameId}/disqualifiedTeams/${current.teamId}`).set(true);
          resetBuzz(true);
          restoreVolume();
        }
      });
    });

    if(currentBuzzCard) currentBuzzCard.classList.add('buzzedCard');

    document.querySelectorAll('#teamList img').forEach(avatar=>{
      if(avatar.dataset.teamId===b.teamId){
        avatar.classList.add('buzzed');
        avatar.classList.remove('disabled','disqualified');
      }else avatar.classList.add('disabled');
    });
  }else{
    restoreVolume();
    currentBuzz.textContent="";
    correctBtn.style.display="none";
    wrongBtn.style.display="none";
    clearInterval(timerInterval);
    timerEl.textContent="";
    questionOpen=false;
    answerDisplay.textContent="";
    if(currentBuzzCard) currentBuzzCard.classList.remove('buzzedCard');

    document.querySelectorAll('#teamList img').forEach(img=>{
      img.classList.remove('buzzed','disabled');
    });
  }
});

db.ref(gameId + "/disqualifiedTeams").on('value', snap=>{
  const dq = snap.val() || {};
  document.querySelectorAll('#teamList img').forEach(img=>{
    if(dq[img.dataset.teamId]){
      img.classList.add('disqualified');
      img.classList.remove('buzzed','disabled');
    }else img.classList.remove('disqualified');
  });
});

function resetBuzz(keepQuestionOpen = false){
  db.ref(gameId + "/buzz").set({buzzed:false, team:null, teamId:null});
  db.ref(gameId + "/buzzLocked").set(false);
  if(!keepQuestionOpen){
    db.ref(gameId + "/questionOpen").set(false);
    questionOpen=false;
  } else {
    db.ref(gameId + "/questionOpen").set(true);
    db.ref(gameId + "/correctTeams").set(null);
    questionOpen = true;
  }
  currentBuzz.textContent="";
  answerDisplay.textContent="";
  correctBtn.style.display="none";
  wrongBtn.style.display="none";
  timerEl.textContent="";
  if(currentBuzzCard) currentBuzzCard.classList.remove('buzzedCard');

  document.querySelectorAll('#teamList img').forEach(img => {
    img.classList.remove('buzzed','disabled');
  });
}

correctBtn.addEventListener('click', ()=>{
  db.ref(gameId + "/buzz").once('value').then(snap=>{
    const b = snap.val();
    if(b && b.buzzed){
      givePoints(b.teamId, currentQuestionPoints);
      resetBuzz(false); 
      stopTrack();
    }
  });
});

wrongBtn.addEventListener('click', ()=>{

  // ⚡ Afspil WRONG-lyd
  try {
    wrongSound.currentTime = 0;
    wrongSound.play().catch(err => console.warn("Wrong-lyd kunne ikke afspilles:", err));
  } catch(e){
    console.warn("Wrong-lyd fejl:", e);
  }

  db.ref(gameId + "/buzz").once('value').then(snap=>{
    const b = snap.val();
    if(b && b.buzzed && b.teamId){
      db.ref(`${gameId}/disqualifiedTeams/${b.teamId}`).set(true);
    }
    resetBuzz(true);
  });


    // 🔍 Tjek om alle hold er disket på dette spørgsmål
    db.ref(gameId + "/teams").once('value').then(teamsSnap => {
      const allTeams = teamsSnap.val() || {};
      db.ref(gameId + "/disqualifiedTeams").once('value').then(disqSnap => {
        const disqTeams = disqSnap.val() || {};
        const allBuzzableTeams = Object.keys(allTeams);
        const disqualifiedTeams = Object.keys(disqTeams);

        if(allBuzzableTeams.every(teamId => disqualifiedTeams.includes(teamId))){
          stopTrack();  // stopper Spotify-afspilningen
          console.log("Alle hold er disket – musikken stoppet.");
        }
      });
    });

});

function givePoints(teamId, points){
  const teamRef = db.ref(`${gameId}/teams/${teamId}`);
  db.ref(`${gameId}/correctTeams/${teamId}`).set(true);
  teamRef.once('value').then(snap=>{
    const oldPoints = snap.val().points || 0;
    teamRef.update({ points: oldPoints + points });
  });
}

function reduceVolumeForBuzz(){
  setProgramVolume(0.3);
}

function restoreVolume(){
  setProgramVolume(0.8);
}

function stopTrack(){
  if(player){
    fetch(`https://api.spotify.com/v1/me/player/pause`, {
      method:"PUT",
      headers: { "Authorization":`Bearer ${accessToken}` }
    });
  }
}

function makeSpotifyUri(url) {
  if (!url) return null;

  // Allerede et korrekt URI-format
  if (url.startsWith("spotify:track:")) return url;

  // Håndtér både /track/ og /embed/track/
  if (url.includes("open.spotify.com/track/") || url.includes("open.spotify.com/embed/track/")) {
    const id = url.split("track/")[1].split("?")[0];
    return "spotify:track:" + id;
  }

  // fallback
  return url;
}

function startTimer(seconds, onExpire){
  clearInterval(timerInterval);
  let t = seconds;
  timerEl.textContent = t;
  timerInterval = setInterval(()=>{
    t--;
    timerEl.textContent = t;
    if(t<=0){
      clearInterval(timerInterval);
      timerEl.textContent="";
      if(onExpire) onExpire();
    }
  }, 1000);
}

</script>
</body>
</html>
